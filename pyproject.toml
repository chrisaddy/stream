[project]
name = "stream"
version = "0.1.0"
description = "Bitcoin ML: illicit transaction detection, fee estimation, and compliance infrastructure"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    # Web
    "python-fasthtml>=0.12.0",
    "uvicorn[standard]>=0.34.0",
    "pydantic-settings>=2.7.0",
    # Data
    "numpy>=2.2.0",
    "sqlalchemy>=2.0.0",
    "psycopg2-binary>=2.9.0",
    # Cloud storage (R2 model loading)
    "boto3>=1.35.0",
    # HTTP
    "httpx>=0.28.0",
    # LLM
    "anthropic>=0.43.0",
    # Streaming
    "sse-starlette>=2.2.0",
    # Viz
    "plotly>=6.0.0",
    # Logging
    "structlog>=24.4.0",
    # Online ML
    "river>=0.21.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/stream"]

[tool.ruff]
line-length = 100
target-version = "py313"

[tool.ruff.lint]
select = ["E", "F", "I"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

[project.optional-dependencies]
training = [
    "prefect>=3.6.20",
    "prefect-aws>=0.5.0",
    "torch>=2.6.0",
    "torch-geometric>=2.7.0",
]
ml = [
    "xgboost>=2.1.0,<3.1",
    "lightgbm>=4.5.0",
    "scikit-learn>=1.6.0",
    "shap>=0.46.0",
    "pandas>=2.2.0",
    "networkx>=3.4.0",
]

[dependency-groups]
dev = [
    "httpx>=0.28.1",
    "pytest>=9.0.2",
    "prefect>=3.6.20",
    "prefect-aws>=0.5.0",
    "torch>=2.6.0",
    "torch-geometric>=2.7.0",
    "xgboost>=2.1.0,<3.1",
    "lightgbm>=4.5.0",
    "scikit-learn>=1.6.0",
    "shap>=0.46.0",
    "pandas>=2.2.0",
    "networkx>=3.4.0",
]
